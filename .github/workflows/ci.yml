name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run a simple check
        run: python -c "from app import greet, farewell; print(greet('CI')); print(farewell('CI'))"
  

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Deploy (simulated)
        run: |
          echo "Running deployment steps..."
          echo "Deploying app.py to production..."
          echo "Deployment complete!"